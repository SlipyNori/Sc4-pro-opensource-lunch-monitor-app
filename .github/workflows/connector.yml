name: Connector (Windows)

# Builds the OpenSC4 Connector as a single Windows .exe (Node single executable
# application). Every run uploads it as a workflow artifact. A release is
# published for a pushed "connector-v*" tag, or for a commit whose message
# contains "[release connector]".
on:
  push:
    # Without a branch filter, a tag filter alone stops branch pushes from running it
    branches: ['**']
    paths:
      - 'connector/**'
      - '.github/workflows/connector.yml'
    tags:
      - 'connector-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run connector:build
      - name: Build single executable
        shell: bash
        run: |
          echo '{ "main": "connector/dist/opensc4-connector.cjs", "output": "sea-prep.blob", "disableExperimentalSEAWarning": true }' > sea-config.json
          node --experimental-sea-config sea-config.json
          cp "$(command -v node)" opensc4-connector.exe
          npx --yes postject@1.0.0-alpha.6 opensc4-connector.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - name: Smoke test
        shell: bash
        run: |
          ./opensc4-connector.exe --port 8799 > run.log 2>&1 &
          sleep 3
          cat run.log
          grep -q "OpenSC4 Connector" run.log
          taskkill //F //IM opensc4-connector.exe || true
      - uses: actions/upload-artifact@v4
        with:
          name: opensc4-connector-windows
          path: opensc4-connector.exe
      - name: Read connector version
        id: ver
        shell: bash
        run: echo "version=$(sed -n "s/.*CONNECTOR_VERSION = '\(.*\)'.*/\1/p" connector/src/protocol.ts)" >> "$GITHUB_OUTPUT"
      # Publish a release when a connector-v* tag is pushed, or when a commit
      # message contains "[release connector]" (GitHub then creates the tag
      # connector-v<version> on that commit).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/connector-v') || contains(github.event.head_commit.message, '[release connector]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('connector-v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: OpenSC4 Connector ${{ steps.ver.outputs.version }}
          files: opensc4-connector.exe
          body: |
            Sends Swing Caddie SC4 Pro shots from the OpenSC4 app to GSPro and other simulators that accept the GSPro Open Connect format.
            Download opensc4-connector.exe, run it, then switch on "Send my shots to golf simulators" in the app's Simulators tab.
            See docs/CONNECTOR.md for setup.
